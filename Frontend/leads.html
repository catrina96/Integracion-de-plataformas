<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Leads - Peluditos Pet Chile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
      <span class="navbar-brand">🐾 Peluditos Pet Chile</span>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="text-primary">Gestión de Leads</h2>
    <p class="text-muted">Registra consultas de clientes desde redes sociales.</p>

    <form class="card p-4 shadow-sm">
      <div class="mb-3">
        <label class="form-label">Nombre del Cliente</label>
        <input type="text" class="form-control" placeholder="Ej: Juan Pérez">
      </div>
      <div class="mb-3">
        <label class="form-label">Canal de Contacto</label>
        <select class="form-select">
          <option>Instagram</option>
          <option>Facebook</option>
          <option>TikTok</option>
          <option>WhatsApp</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Interés del Cliente</label>
        <textarea class="form-control" rows="3" placeholder="Ej: Pastel personalizado para perro"></textarea>
      </div>
      <button class="btn btn-primary w-100">Registrar Lead</button>
    </form>
  </div>
</body>
</html>
